<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found — Nodra.design</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500&display=swap">
<style>
:root{--ground:#09090A;--ink:#F2F1ED;--ink-soft:rgba(242,241,237,.56);--hair:rgba(242,241,237,.13);--accent:#FF4A21;color-scheme:dark light}
@media (prefers-color-scheme:light){:root{--ground:#F4F3EF;--ink:#0B0B0C;--ink-soft:rgba(11,11,12,.6);--hair:rgba(11,11,12,.14);--accent:#E03A12}}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:flex;flex-direction:column;justify-content:center;background:var(--ground);color:var(--ink);
 font-family:"Space Grotesk",Helvetica,sans-serif;padding:clamp(24px,6vw,80px);-webkit-font-smoothing:antialiased}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(56px,16vw,190px);line-height:.9;letter-spacing:-.04em;margin:0}
h1 em{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400;color:var(--accent)}
p{max-width:44ch;color:var(--ink-soft);font-size:clamp(15px,1.4vw,19px);margin:26px 0 0}
.mono{font-size:11px;letter-spacing:.17em;text-transform:uppercase;display:flex;align-items:center;gap:10px;color:var(--ink-soft)}
.mono::before{content:"";width:26px;height:1px;background:var(--accent)}
a.btn{display:inline-flex;align-items:center;gap:10px;margin-top:34px;border:1px solid var(--ink);border-radius:99px;padding:14px 24px;text-decoration:none;color:inherit;transition:background .3s,color .3s,border-color .3s}
a.btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
  <span class="mono">Error 404</span>
  <h1>This page <em>changed.</em></h1>
  <p>Unlike your product, which is the one thing we never let drift. The page you were after isn't here.</p>
  <a class="btn" href="index.html"><span>Back to nodra.design</span><span>→</span></a>
</body>
</html>
